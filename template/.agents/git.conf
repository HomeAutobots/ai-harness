# ai-harness git workflow. Project-owned; harness-tailor proposes values from this repo's history.
# Layering, last wins: harness defaults < ~/.config/ai-harness/git.conf (your personal workflow,
# follows you across repos) < this file. Leave a line commented to inherit it.
# Check the result any time: .agents/bin/gitflow config
#
# Templates use placeholders: {ticket} {slug} {type} {summary} {author} {user}.
# The same template builds names and messages (gitflow start/commit) and validates them.

# Where work starts and PRs go. Empty: the remote's default branch. Any name works (dev/main).
# GIT_BASE="develop"
# Branches never committed or pushed to directly (globs). "{base}" means whatever GIT_BASE is.
# Empty (the default): nothing is protected, which suits solo and trunk-based repos.
# GIT_PROTECTED="{base} main release/*"

# Tickets: an ID regex, and a link template for PR bodies.
# GIT_TICKET="[A-Z][A-Z0-9]+-[0-9]+"
# GIT_TICKET_URL="https://jira.example.com/browse/{ticket}"

# Branch names. Empty: any name that isn't protected.
# GIT_BRANCH="{type}/{ticket}-{slug}"
# GIT_BRANCH_TYPES="feature bugfix hotfix chore"

# A whole-message commit template (see .agents/git/commit.example.md). When one is in effect it
# is the single source for the message: the first line is the subject, "Label: {x}" lines are
# sections (required unless the # guidance line above says "(optional)"), # lines are guidance.
# {ticket} {type} {summary} {author} {branch} {user} fill themselves; any other placeholder is
# written by the author. Humans get it prefilled in the editor; agents fill it with
# gitflow commit --section Label=text. Empty: this repo's local git commit.template, if set.
# GIT_COMMIT_TEMPLATE=".agents/git/commit.md"

# Without a template: commit subjects, an optional extra rule, and required trailers.
# GIT_COMMIT="{ticket}: {summary}"
# GIT_COMMIT_TYPES="feat fix refactor perf test docs build ci chore"
# GIT_COMMIT_PATTERN='^.{10,72}$'
# GIT_COMMIT_TRAILERS="Refs: {ticket}|Signed-off-by: {author}"

# Remote, how a branch catches up with the base (merge|rebase), and force pushes
# (lease-own: --force-with-lease on your own branch only | never).
# GIT_REMOTE="origin"
# GIT_UPDATE="merge"
# GIT_FORCE="lease-own"

# Pull or merge requests: gh | glab | none (the agent prints the text for you).
# GIT_PR_TOOL="gh"
# GIT_PR_TITLE="{ticket}: {summary}"
# GIT_PR_TEMPLATE=".agents/git/pr.md"
# GIT_PR_DRAFT="0"
# GIT_MERGE_METHOD="squash"

# Steps agents may take themselves: branch commit push pr merge. The rest are yours.
# Setting this here also renders native deny rules for the other steps (Claude Code, Codex).
# GIT_AGENT_MAY="branch commit"

# Verify tier that must pass before gitflow push (edit|turn|full|off). A tier that can't run
# (not configured yet) is reported, not treated as a failure.
# GIT_PUSH_REQUIRES="full"
# Local commit-msg and pre-push hooks: auto installs them only when something above needs
# enforcing (protected branches, branch or commit formats, trailers); on or off to force it.
# GIT_LOCAL_HOOKS="auto"

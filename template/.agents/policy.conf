# ai-harness policy. Project-owned.
# Enforced by the pre-tool hook in every tool with hooks (Claude Code, Copilot, Cursor) and
# rendered into native permission rules where a tool has them (Claude Code, Codex).
#
#   deny-cmd   <prefix>   a shell command, or any segment of a chain or pipeline, starting with it
#   deny-arg   <token>    a shell command containing this token as a word
#   deny-regex <regex>    a shell command matching this regex (Python syntax; hooks only)
#   deny-read  <glob>     reading a matching path, directly or by naming it in a shell command
#   allow-read <glob>     exception to deny-read
# Globs: ./ is the repo root, ~/ is home, ** spans directories.
# Anything after " #" is the reason shown to the agent.
# Check a rule: .agents/bin/policy test "<command>" (or --read <path>) shows the line that decides.

# Git workflow rules (who may push, open PRs, or merge; protected branches; branch and commit
# formats; rebase vs merge) come from .agents/git.conf and are enforced by gitflow, this hook,
# and the git hooks. A deny-cmd here always wins, e.g. to forbid agent pushes outright.
deny-cmd git reset --hard               # destroys uncommitted work
deny-cmd git clean -f                   # deletes untracked files
deny-cmd git clean -fd                  # deletes untracked files
deny-regex \bgit(?:\s+(?:-[Cc]\s*(?:"[^"]*"|'[^']*'|\S+)|-[a-zA-Z]\b|--[\w-]+(?:=\S+|\s+[^-\s]\S*)?))*\s+clean\b[^|;&\n]*\s["']?-[a-zA-Z]*[xX]   # removes ignored files too, which wipes a local harness install (.agents/, tailoring, plans); dry runs with -x are blocked too
deny-regex \bgit(?:\s+(?:-[Cc]\s*(?:"[^"]*"|'[^']*'|\S+)|-[a-zA-Z]\b|--[\w-]+(?:=\S+|\s+[^-\s]\S*)?))*\s+stash\b[^|;&\n]*\s["']?(-[a-zA-Z]*a[a-zA-Z]*\b|--al?l?\b)   # stashes ignored files, which takes a local harness install away until the pop; git stash -u is fine
deny-cmd git filter-branch              # rewrites history
deny-cmd git filter-repo                # rewrites history
deny-cmd sudo                           # no privilege escalation
deny-cmd rm -rf /                       # catastrophic
deny-cmd rm -rf ~                       # catastrophic
deny-cmd .agents/bin/guard allow        # approving a suppression is a human decision
deny-arg --no-verify                    # skips commit hooks
deny-regex (?:^|[\s;&|(`"'/\\])(?:rm|mv|cp|ln|chmod|truncate|tee|touch|install|unlink|rmdir|shred|(?i:remove-item|move-item|copy-item|set-content|add-content|clear-content|out-file|new-item|del|erase|ri))\s[^|;&\n]*\.git[\\/]hooks(?:[\\/]|["'\s]|$)|>\s*["']?[^\s|;&<>]*\.git[\\/]hooks[\\/]|\b(?:sed|perl)\s+(?:[^|;&\n]*\s)?-(?:[a-zA-Z]*i|-in-place)[^|;&\n]*\.git[\\/]hooks[\\/]|\bfind\s[^|;&\n]*\.git[\\/]hooks[^|;&\n]*\s-(?:delete\b|(?:exec|execdir|ok)\s+\S*(?:rm|mv|cp|ln|chmod|truncate|tee|sed|perl|shred|unlink)\b)   # changing or removing git hooks switches the commit hooks off; reading them is fine
deny-regex (curl|wget)[^|]*\|\s*(sudo\s+)?(ba|z)?sh   # piping downloads into a shell

deny-read ./**/.env*                    # secrets
allow-read ./**/.env.example
allow-read ./**/.env.sample
deny-read ./**/*.pem                    # key material
deny-read ./**/*.key                    # key material
deny-read ./**/*.p12                    # key material
deny-read ./**/*.pfx                    # key material
deny-read ./**/*.jks                    # key material
deny-read ~/.ssh/**                     # credentials
deny-read ~/.aws/**                     # credentials
deny-read ~/.gnupg/**                   # credentials
deny-read ~/.config/gh/**               # credentials
deny-read ~/.docker/config.json         # credentials
deny-read ~/.netrc                      # credentials

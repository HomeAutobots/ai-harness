# ai-harness config. Project-owned. Read by sync, verify, gitflow, install.sh, and the hooks.

# Tool adapters sync maintains:
#   claude   CLAUDE.md (@AGENTS.md), .claude/skills mirrors, library agents in .claude/agents,
#            .claude/settings.json hooks + deny rules (settings.local.json instead, in local mode)
#   copilot  .github/hooks/harness.json (Copilot CLI, cloud agent, VS Code agent mode), and library
#            agents in .github/agents
#   cursor   .cursor/hooks.json, and library agents in .cursor/agents
#   codex    .codex/hooks.json hooks + .codex/rules/harness.rules deny rules (Codex reads AGENTS.md
#            and .agents/skills natively), and library agents in .codex/agents
#   gemini   .gemini/settings.json so Gemini CLI loads AGENTS.md, plus its hooks, and library
#            agents in .gemini/agents
# Codex and Gemini CLI run project hooks only in a trusted project, after you review them.
# Library MCP servers (mcp/<name>.json) merge into .mcp.json (claude, copilot), .cursor/mcp.json,
# .gemini/settings.json, and a marked block in .codex/config.toml, beside servers added by hand.
ADAPTERS="claude copilot cursor"

# Where the harness lives in git:
#   local  (default for new installs) hidden from git in this clone with .git/info/exclude;
#          files the project tracks are never modified
#   team   committed and shared, as before this setting existed (a missing line means team)
# Switch with install.sh --local or --team, not by editing this line.
HARNESS_MODE="local"

# Hooks wired into every adapter that supports them:
#   policy  block denied commands and secret reads before they run
#   edit    run `check` on edited files and hand findings straight back
#   turn    run `verify` when the agent tries to finish a turn that changed files; block on failure
#   questions  record questions to you and your answers in the plan's question ledger, surface an
#              earlier answer before the agent re-asks, and remind new sessions of open questions
#              (Codex and Gemini CLI: the session reminder only; they have no question tool to hook;
#              Codex's also says when the AGENTS.override.md sync wrote in local mode is stale)
HOOKS="policy edit turn questions"

# Budgets in seconds. Out of budget means "skipped", never a block. FULL_BUDGET=0 is unlimited.
EDIT_BUDGET=15
TURN_BUDGET=300
FULL_BUDGET=0
# Times the stop gate sends the agent back within one turn before handing back to you.
TURN_MAX_BLOCKS=3
# When a turn leaves new untracked files outside .agents/work/, the stop gate names them once (after
# verify passes or can't run) and asks the agent to move any scratch there and say why the rest
# belong in the repo.
# on or off; missing means on.
WORK_REMIND="on"
# 1 = a crashed policy hook denies the tool call instead of allowing it.
POLICY_FAIL_CLOSED=0

# Validation gates (validate skill) that always end with a check-in with you: plan tests impl.
# Remove a gate to let it pass without asking; the validator still asks when something is unclear.
VALIDATE_ASK="plan tests impl"

# Output shaping for feedback tools.
FEEDBACK_MAX_LINES=30
FEEDBACK_MAX_PER_FILE=5

# How sync renders skills into .agents/skills and .claude/skills: symlink, or copy (Windows
# without symlinks). Team mode always copies a shared skill from a library outside the repo.
# sync warns before replacing a copy edited by hand; edit the skill in its library instead.
LINK_MODE="symlink"

# Libraries of skills, workflows, and stacks besides this project's own .agents/library/, searched
# after it and before your personal ~/.config/ai-harness/ and the built-ins (.agents/builtin/).
# Space-separated paths relative to the project root (a submodule, say), ~/..., or absolute; no
# spaces inside a path. Empty: none. One that isn't here or is empty (a submodule not checked out)
# is a tooling problem: sync keeps its renders and sync --check fails, and verify and gitflow fail
# for an active workflow or stack that then doesn't resolve, until it's back.
LIBRARIES=""

# Models for library agents (agents/<name>.md says model: fast | standard | strong, and maybe
# effort: low | medium | high | max). Map each tier per tool; a missing key means the agent
# inherits the session's model (or effort). Tools: CLAUDE COPILOT CURSOR CODEX GEMINI.
# An agent's own effort: beats the tier's default. Pin one agent's model with a native: line.
#   MODEL_STRONG_CLAUDE="opus"
#   EFFORT_STRONG_CLAUDE="high"
#   MODEL_FAST_CLAUDE="haiku"
#   MODEL_STRONG_CODEX="<model id>"

# Stack packs (language tooling) and workflow packs (process) in use, by name, from any library.
# install.sh --stack / --workflow adds a name here and does the pack's one-time setup.
# A stack's own settings (CPP_* for cpp-cmake, PY_* for python) can go in this file too; see the
# pack's README.
STACKS=""
WORKFLOWS=""
